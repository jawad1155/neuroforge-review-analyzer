version: '3.8'

services:
  neuroforge:
    build: .
    container_name: neuroforge-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AMD_RADEON_API_KEY=${AMD_RADEON_API_KEY}
      - EVOLUS_WORKSPACE_ID=${EVOLUS_WORKSPACE_ID}
      - EVOLUS_AGENT_ID=${EVOLUS_AGENT_ID}
      - EVOLUS_API_KEY=${EVOLUS_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./neuroforge.db}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
